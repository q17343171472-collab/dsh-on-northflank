worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # DSH 的浏览器信任栅栏要求 Host / Origin 与 --trusted-host 完全一致，
  # 所以这里原样透传浏览器带来的 Host 和 Origin，绝不改写。
  log_format dsh '$remote_addr - $host "$request" $status $body_bytes_sent '
                 '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log dsh;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 75s;
  client_max_body_size 200m;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream dsh_upstream {
    server 127.0.0.1:3080;
    keepalive 32;
  }

  server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # 反代到 DSH
    location / {
      proxy_pass http://dsh_upstream;
      proxy_http_version 1.1;

      # ── 关键：保留浏览器面向的 Host / Origin ──────────────────────────
      proxy_set_header Host              $host;
      proxy_set_header Origin            $http_origin;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;

      # ── WebSocket / SSE ─────────────────────────────────────────────
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;

      proxy_connect_timeout 30s;
      proxy_send_timeout    3600s;
      proxy_read_timeout    3600s;
    }

    # DSH 自己的静态资源与 API 都在根路径下，无需额外 location。
    # 健康检查用 TCP（/ 会返回 401），所以这里不额外暴露 healthz。
  }
}